<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist | Матрица Эйзенхауэра</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header class="header">
        <h1>Мой Wishlist</h1>
        <p>Матрица Эйзенхауэра</p>
    </header>

    <main class="matrix-wrapper">
        <div class="matrix-grid">
            
            <!-- Квадрант 1: Важно и Срочно -->
            <section class="quadrant q-urgent-important">
                <div class="quadrant-header">
                    <h2>Важно & Срочно</h2>
                    <span class="subtitle">Покупаем в первую очередь</span>
                </div>
                <div class="items-container" id="container-q1">
                    <!-- Пример того, что будет рендерить JS (сейчас можно закомментировать) -->
                    <!--
                    <div class="wish-item">
                        <div class="item-content">
                            <h3>Новый SSD</h3>
                            <p class="price">~ 10 000 ₽</p>
                        </div>
                        <a href="https://example.com" target="_blank" class="item-link">Ссылка</a>
                    </div>
                    -->
                </div>
            </section>

            <!-- Квадрант 2: Важно, Не срочно -->
            <section class="quadrant q-important">
                <div class="quadrant-header">
                    <h2>Важно, Не срочно</h2>
                    <span class="subtitle">Стратегический квадрат</span>
                </div>
                <div class="items-container" id="container-q2"></div>
            </section>

            <!-- Квадрант 3: Не важно, Срочно -->
            <section class="quadrant q-urgent">
                <div class="quadrant-header">
                    <h2>Не важно, Срочно</h2>
                    <span class="subtitle"></span>
                </div>
                <div class="items-container" id="container-q3"></div>
            </section>

            <!-- Квадрант 4: Не важно, Не срочно -->
            <section class="quadrant q-none">
                <div class="quadrant-header">
                    <h2>Не важно & Не срочно</h2>
                    <span class="subtitle"></span>
                </div>
                <div class="items-container" id="container-q4"></div>
            </section>

        </div>
    </main>
</body>
</html>
